# Airlock — paranoid profile.
#
# Posture: default-deny. Anything not explicitly granted asks a human, and an
# `ask` that reaches no human is refused. For a regulated repo, a production
# credential, or an agent you do not yet trust. Expect to run `airlock allow`.
#
# EVALUATION ORDER
#   1. block rules — checked against the primary field AND every other string in
#      the arguments, nested ones included. A block here is ABSOLUTE: no grant,
#      no allow rule and no contract can override it.
#   2. grants — reviewed exceptions added by `airlock allow`.
#   3. rules — first match wins (allow / ask / block).
#   4. default.
#
# Paths use ${workspace} (the repo the agent is in), ${home}, ${user}, ${tmp}.

profile: paranoid
mode: enforce           # default-deny: unmatched calls ask, unattended asks are refused
default: ask
# What an `ask` becomes when no human can be reached.
# NOTE: this applies in `enforce` only. Under `guard` an unreachable ask is
# ALLOWED (and reported) by design — that is what makes guard different from
# enforce. Under `observe` nothing is refused at all.
ask_fallback: block

escalate:
  high: block           # a high-severity scan flag refuses the call outright
  med: ask

grants: []              # managed by `airlock allow` — reviewed exceptions

rules:
  # ---- absolute blocks: destructive ----------------------------------
  - { tool: "*", match: "*rm *-*r*f* /*",     action: block, reason: "destructive recursive delete" }
  - { tool: "*", match: "*rm *-*f*r* /*",     action: block, reason: "destructive recursive delete" }
  - { tool: "*", match: "*rm *-*r*f* ~*",     action: block, reason: "destructive recursive delete (home)" }
  # $HOME is the same delete one substitution later; the shell expands it, we do not
  - { tool: "*", match: "*rm *-*r*f*$HOME*",  action: block, reason: "destructive recursive delete (home)" }
  - { tool: "*", match: "*rm *-*r*f*${HOME*", action: block, reason: "destructive recursive delete (home)" }
  - { tool: "*", match: "*-delete*",          action: block, reason: "find -delete removes without confirmation" }
  - { tool: "*", match: "*-exec rm*",         action: block, reason: "find -exec rm removes without confirmation" }
  - { tool: "*", match: "*mkfs*",             action: block, reason: "filesystem format" }
  - { tool: "*", match: "*drop table*",       action: block, reason: "destructive SQL" }
  - { tool: "*", match: "*drop database*",    action: block, reason: "destructive SQL" }
  - { tool: "*", match: "*git push --force*", action: block, reason: "force-push rewrites history" }
  - { tool: "*", match: "*git push -f *",     action: block, reason: "force-push rewrites history" }

  # ---- absolute blocks: secrets --------------------------------------
  # Both the directory and what is inside it. `*/.ssh/*` alone left the
  # directory itself on `ask`, which `guard` allows with no daemon — so
  # `git_status ~/.ssh` or any tool that lists a directory walked straight in.
  - { tool: "*", match: "*/.ssh",             action: block, reason: "private-key directory off-limits" }
  - { tool: "*", match: "*/.ssh/*",           action: block, reason: "private-key path off-limits" }
  - { tool: "*", match: "*/.gnupg",           action: block, reason: "GPG keyring directory" }
  - { tool: "*", match: "*/.gnupg/*",         action: block, reason: "GPG keyring" }
  - { tool: "*", match: "*id_rsa*",           action: block, reason: "SSH private key" }
  - { tool: "*", match: "*id_ed25519*",       action: block, reason: "SSH private key" }
  - { tool: "*", match: "*.env*",             action: block, reason: ".env / secrets off-limits" }
  - { tool: "*", match: "*/.aws",             action: block, reason: "AWS credential directory" }
  - { tool: "*", match: "*.aws/credentials*", action: block, reason: "AWS credentials" }
  - { tool: "*", match: "*/.kube",            action: block, reason: "kubeconfig directory" }
  - { tool: "*", match: "*.kube/config*",     action: block, reason: "kubeconfig" }
  - { tool: "*", match: "*.git-credentials*", action: block, reason: "git credentials" }
  - { tool: "*", match: "*.netrc*",           action: block, reason: "netrc credentials" }
  - { tool: "*", match: "*.npmrc*",           action: block, reason: "npm auth token" }
  - { tool: "*", match: "*.docker/config.json*", action: block, reason: "docker registry auth" }

  # ---- absolute blocks: download-and-execute -------------------------
  - { tool: "*", match: "*curl*|*sh*",        action: block, reason: "curl-pipe-shell" }
  - { tool: "*", match: "*wget*|*sh*",        action: block, reason: "wget-pipe-shell" }
  - { tool: "*", match: "*|*bash*",           action: block, reason: "pipe-to-bash" }
  # download-then-run is the same thing in two steps; the second step is the one
  # worth catching, because a downloaded payload lands in a writable temp dir
  - { tool: "*", match: "*sh /tmp/*",         action: block, reason: "executes a script from a temp directory" }
  - { tool: "*", match: "*sh /var/tmp/*",     action: block, reason: "executes a script from a temp directory" }
  - { tool: "*", match: "*chmod *+x*/tmp/*",  action: block, reason: "makes a temp-directory file executable" }

  # ---- absolute blocks: SSRF / known collectors ----------------------
  - { tool: "*", match: "*169.254.169.254*",  action: block, reason: "cloud metadata endpoint (SSRF)" }
  # the same address, written the ways that get past a string match
  - { tool: "*", match: "*2852039166*",       action: block, reason: "cloud metadata endpoint, decimal form (SSRF)" }
  - { tool: "*", match: "*0xa9fea9fe*",       action: block, reason: "cloud metadata endpoint, hex form (SSRF)" }
  - { tool: "*", match: "*0251.0376.0251.0376*", action: block, reason: "cloud metadata endpoint, octal form (SSRF)" }
  # No square brackets in a match: `match` is fnmatch, so "[::ffff:1.2.3.4]"
  # is a CHARACTER CLASS and matches any path containing a dot or a digit.
  - { tool: "*", match: "*ffff:169.254.169.254*", action: block, reason: "cloud metadata endpoint, v6-mapped (SSRF)" }
  - { tool: "*", match: "*169.254.169.254.nip.io*",   action: block, reason: "metadata address via a wildcard DNS service" }
  - { tool: "*", match: "*metadata.google.internal*", action: block, reason: "cloud metadata endpoint (SSRF)" }
  - { tool: "*", match: "*webhook.site*",     action: block, reason: "known exfil collector" }
  - { tool: "*", match: "*requestbin*",       action: block, reason: "known exfil collector" }
  - { tool: "*", match: "*.oastify.com*",     action: block, reason: "known exfil collector" }
  - { tool: "*", match: "*interact.sh*",      action: block, reason: "known exfil collector" }

  # ---- absolute blocks: launching an MCP server outside the gate -----
  # Airlock only sees servers the agent starts THROUGH it. A shell that starts
  # one directly is a way around the whole boundary — see README, "Limits".
  - { tool: "Bash",                match: "*mcp-server*",   action: block, reason: "starts an MCP server outside Airlock" }
  # @modelcontextprotocol/server-* is how most servers are actually written down
  - { tool: "Bash",                match: "*modelcontextprotocol*", action: block, reason: "starts an MCP server outside Airlock" }
  - { tool: "*__run_command",      match: "*modelcontextprotocol*", action: block, reason: "starts an MCP server outside Airlock" }
  - { tool: "Bash",                match: "*server-filesystem*",    action: block, reason: "starts an MCP server outside Airlock" }
  - { tool: "Bash",                match: "*@mcp/*",                action: block, reason: "starts an MCP server outside Airlock" }
  - { tool: "Bash",                match: "*mcp_server*",   action: block, reason: "starts an MCP server outside Airlock" }
  - { tool: "*__run_command",      match: "*mcp-server*",   action: block, reason: "starts an MCP server outside Airlock" }
  - { tool: "Bash",                match: "*claude mcp add*", action: block, reason: "registers an MCP server outside Airlock" }
  # Any tool, not just Bash: an agent with a Write tool does not need a shell to
  # rewrite the server list or unhook the gate, and asking about it is not
  # enough — an unattended ask is an allow under `guard`.
  - { tool: "*", match: "*.mcp.json*",         action: block, reason: "the MCP server list is the gate's own config" }
  - { tool: "*", match: "*.claude/settings*.json*", action: block, reason: "agent may not rewire its own hooks" }
  # ...and tampering with Airlock's own configuration
  - { tool: "*", match: "*.airlock/*",        action: block, reason: "agent may not edit its own firewall" }
  - { tool: "*", match: "*airlock*policy.yaml*", action: block, reason: "agent may not edit its own firewall" }

  # ---- shell: any command execution needs a human --------------------
  - { tool: "Bash",                 action: ask,   reason: "shell execution" }
  - { tool: "mcp__*__run_command",  action: ask,   reason: "remote shell via MCP" }
  - { tool: "*__shell",             action: ask,   reason: "shell via MCP" }
  - { tool: "*__exec*",             action: ask,   reason: "remote execution via MCP" }

  # ---- network egress: allow-list only, else ask ---------------------
  - { tool: "*fetch*", match: "http://*",  action: block, reason: "cleartext egress" }
  - { tool: "*fetch*",                     action: ask,   reason: "network egress to un-listed host" }
  - { tool: "WebFetch",                    action: ask,   reason: "network egress" }
  - { tool: "WebSearch",                   action: ask,   reason: "network egress" }

  # ---- reads scoped to the workspace ---------------------------------
  - { tool: "Read", match: "${workspace}/*", action: allow, reason: "in-workspace read" }
  - { tool: "Glob",                          action: allow, reason: "workspace listing" }
  - { tool: "Grep",                          action: allow, reason: "workspace search" }
  - { tool: "NotebookRead", match: "${workspace}/*", action: allow, reason: "in-workspace read" }

  # ---- every write is confirmed, workspace or not --------------------
  - { tool: "Write",  action: ask, reason: "file write" }
  - { tool: "Edit",   action: ask, reason: "file edit" }
  - { tool: "NotebookEdit", action: ask, reason: "notebook edit" }

name: publish to PyPI

# Publishes airlock-agent to PyPI when a GitHub release is published, using
# PyPI Trusted Publishing (OIDC) — no API token is stored anywhere. The tag's
# version must match pyproject's `version`, or the job fails before uploading.
#
# One-time setup on PyPI (https://pypi.org/manage/project/airlock-agent/settings/publishing/):
#   Publisher: GitHub  ·  Owner: cyberbobas  ·  Repo: airlock
#   Workflow: publish.yml  ·  Environment: pypi

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    name: build sdist+wheel and publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guard — tag version must equal pyproject version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          proj=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag  pyproject=$proj"
          test "$tag" = "$proj" || { echo "::error::tag $tag != pyproject $proj"; exit 1; }

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
